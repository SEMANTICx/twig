[package]
name = "twig"
version = "0.3.0"
edition = "2021"
description = "A thin, high-discipline coding-agent harness in Rust with a borderless TUI, tiered policy, isolated subagents, and curated skills."
license = "MIT"
repository = "https://github.com/SEMANTICx/twig"
keywords = ["ai", "agent", "tui", "cli", "coding"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
shlex = "1.3"
ureq = "2.10"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package.metadata.binstall]
pkg-url = "https://github.com/SEMANTICx/twig-dist/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
