[package]
name = "twig"
version = "0.2.0"
edition = "2021"
description = "A thin agent harness: magpie provides models, this provides the loop."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
shlex = "1.3"
ureq = "2.10"
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
